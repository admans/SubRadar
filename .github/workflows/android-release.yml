name: Build Android APK

on:
  # Trigger on Tag push (Standard way)
  push:
    tags:
      - 'v*'
  # Trigger manually from GitHub UI (Easier way)
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, for example v2.0.0.7'
        required: true
        default: 'v2.0.0.7'
      notes:
        description: 'Detailed release notes. Include user-facing highlights, fixes, UI changes, and known notes.'
        required: false
        default: |
          Highlights:
          - 

          Fixes and polish:
          - 

          Notes:
          - 

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important: Fetch all history for git log

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      # Install Translate Shell for automatic translation
      - name: Install Translate Shell
        run: |
          wget -qO trans git.io/trans
          chmod +x ./trans
          sudo mv trans /usr/local/bin/

      # 1. Determine Version
      - name: Set Version Variable
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION_TAG=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          else
            echo "VERSION_TAG=${{ github.ref_name }}" >> $GITHUB_ENV
          fi

      # 2. Generate detailed bilingual changelog
      - name: Generate Detailed Release Notes
        id: changelog
        run: |
          if git describe --exact-match --tags HEAD >/dev/null 2>&1; then
             PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          else
             PREV_TAG=$(git describe --tags --abbrev=0 HEAD 2>/dev/null || echo "")
          fi

          if [ -z "$PREV_TAG" ]; then
            LOG_RANGE="HEAD"
            RANGE_LABEL="Initial history -> ${{ env.VERSION_TAG }}"
          else
            LOG_RANGE="$PREV_TAG..HEAD"
            RANGE_LABEL="$PREV_TAG -> ${{ env.VERSION_TAG }}"
          fi

          TOTAL_COMMITS=$(git log $LOG_RANGE --pretty=format:"%h" | wc -l | tr -d ' ')
          CONTENT="### Release Scope | 发布范围\n"
          CONTENT="$CONTENT\n- Version range: **$RANGE_LABEL**"
          CONTENT="$CONTENT\n- Included commits: **$TOTAL_COMMITS**"
          CONTENT="$CONTENT\n- APK artifact: **SubRadar-${{ env.VERSION_TAG }}.apk**"
          CONTENT="$CONTENT\n\n### What To Check After Updating | 更新后建议检查"
          CONTENT="$CONTENT\n- Open the app and confirm subscriptions, reminders, balances, and backup import/export still behave as expected."
          CONTENT="$CONTENT\n- 打开应用后，建议检查订阅列表、提醒、余额记录、备份导入导出是否符合预期。"

          append_logs() {
            TITLE="$1"
            GREP_PATTERN="$2"
            EXPLAIN_EN="$3"
            EXPLAIN_ZH="$4"
            LOGS=$(git log $LOG_RANGE --pretty=format:"%s (%h)" --grep="$GREP_PATTERN" -i --extended-regexp || true)

            if [ ! -z "$LOGS" ]; then
              CONTENT="$CONTENT\n\n### $TITLE"
              CONTENT="$CONTENT\n$EXPLAIN_EN"
              CONTENT="$CONTENT\n$EXPLAIN_ZH"
              while IFS= read -r line; do
                if [ ! -z "$line" ]; then
                  CLEAN_MSG=$(echo "$line" | sed -E 's/ \([a-f0-9]+\)$//')
                  TRANS=$(trans -b -e google -s en -t zh-CN "$CLEAN_MSG" 2>/dev/null | head -n1)
                  CONTENT="$CONTENT\n- $line"
                  if [ ! -z "$TRANS" ] && [ "$TRANS" != "$CLEAN_MSG" ]; then
                    CONTENT="$CONTENT\n  <small>$TRANS</small>"
                  fi
                fi
              done <<< "$LOGS"
            fi
          }

          append_logs "New Features | 新功能" "^(feat|feature|add|new|implement)" "- User-visible capabilities added in this release." "- 本版本新增的用户可见能力。"
          append_logs "Workflow Improvements | 使用效率优化" "(efficiency|workflow|quick|filter|default|template|automation|reminder|backup|ledger|balance|subscription|setting|home|search)" "- Changes that reduce daily maintenance work or make frequent actions faster." "- 降低日常维护成本、让常用操作更快的改动。"
          append_logs "UI And Interaction Polish | 界面与交互打磨" "(ui|icon|layout|align|animation|miuix|theme|dialog|sheet|card|visual|style)" "- Layout, motion, icon, and visual consistency updates." "- 布局、动效、图标和视觉一致性相关调整。"
          append_logs "Bug Fixes | 问题修复" "^(fix|bug|issue|resolve|repair|hotfix)" "- Fixes for incorrect behavior, build failures, or edge cases." "- 修复错误行为、构建失败或边界情况。"
          append_logs "Build, Release, And Docs | 构建、发布与文档" "(build|release|version|gradle|ci|workflow|docs|readme|changelog)" "- Project maintenance, release automation, documentation, and versioning changes." "- 项目维护、发布自动化、文档和版本号相关改动。"
          append_logs "Code Maintenance | 代码维护" "^(refactor|chore|perf|optimize|cleanup)" "- Internal cleanup and implementation improvements." "- 内部整理和实现层优化。"

          OTHERS=$(git log $LOG_RANGE --pretty=format:"- %s (%h)" --invert-grep --extended-regexp --grep="^(feat|feature|add|new|implement|fix|bug|issue|resolve|repair|hotfix|refactor|chore|perf|optimize)|efficiency|workflow|quick|filter|default|template|automation|reminder|backup|ledger|balance|subscription|setting|home|search|ui|icon|layout|align|animation|miuix|theme|dialog|sheet|card|visual|style|build|release|version|gradle|ci|docs|readme|changelog|Merge" -i || true)
          if [ ! -z "$OTHERS" ]; then
            CONTENT="$CONTENT\n\n### Other Changes | 其他更改"
            CONTENT="$CONTENT\n- Additional commits that did not match the main categories."
            CONTENT="$CONTENT\n- 未匹配到主要分类的其他提交。"
            CONTENT="$CONTENT\n$OTHERS"
          fi

          FULL_LOG=$(git log $LOG_RANGE --pretty=format:"- %s (%h, %ad)" --date=short || true)
          if [ ! -z "$FULL_LOG" ]; then
            CONTENT="$CONTENT\n\n### Full Commit List | 完整提交列表\n$FULL_LOG"
          fi

          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "CHANGELOG_BODY<<$EOF" >> $GITHUB_ENV
          echo -e "$CONTENT" >> $GITHUB_ENV
          echo "$EOF" >> $GITHUB_ENV

      # 3. Update Android Version
      - name: Update Android Version
        run: |
          CLEAN_VERSION=$(echo "${{ env.VERSION_TAG }}" | sed 's/^v//')
          sed -i "s/versionName = \"[^\"]*\"/versionName = \"$CLEAN_VERSION\"/g" app/build.gradle.kts
          sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" app/build.gradle.kts

      - name: Build APK (Debug)
        run: gradle assembleDebug

      # 4. Rename APK
      - name: Rename APK
        run: |
          cd app/build/outputs/apk/debug/
          mv app-debug.apk SubRadar-${{ env.VERSION_TAG }}.apk

      # 5. Create Release with Bilingual Body
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: SubRadar ${{ env.VERSION_TAG }}
          files: app/build/outputs/apk/debug/SubRadar-${{ env.VERSION_TAG }}.apk
          body: |
            ## SubRadar Android Update | 安卓版本更新

            Version: **${{ env.VERSION_TAG }}**
            Build type: **Debug APK**

            ### Release Summary | 更新概要

            This release includes user-facing improvements, fixes, and polishing work collected since the previous version. The APK attached below can be installed directly on supported Android devices.

            本版本包含自上一版本以来的功能改进、问题修复和体验打磨。下方附带的 APK 可直接安装到支持的 Android 设备上。

            ### Manual Notes | 手动更新说明

            ${{ github.event.inputs.notes }}

            ### Automatically Generated Details | 自动生成的详细变更

            ${{ env.CHANGELOG_BODY }}

            ---

            ### Download | 下载

            Download **SubRadar-${{ env.VERSION_TAG }}.apk** from the assets below.

            请在下方 Assets 区域下载 **SubRadar-${{ env.VERSION_TAG }}.apk**。
          draft: false
          prerelease: false
